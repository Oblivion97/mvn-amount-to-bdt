name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Check Maven Central release build (javadoc, unsigned)
        if: matrix.java == '21'
        run: mvn -B -ntp -P central-release -Dgpg.skip -DskipTests verify
